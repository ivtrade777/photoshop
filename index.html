<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Image Editor</title>
<style>
:root{
  --bg:#1e1e1e; --workspace:#282828; --panel:#323232; --panel2:#2b2b2b; --panel3:#3c3c3c;
  --border:#171717; --border-l:#474747; --text:#d2d2d2; --dim:#8a8a8a; --accent:#2d8ceb;
  --hover:#464646; --sel:#3f5a78; --menu:#3a3a3a;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font:12px/1.3 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
input,[contenteditable]{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit}
svg{display:block}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:#2a2a2a}
::-webkit-scrollbar-thumb{background:#555;border:3px solid #2a2a2a;border-radius:8px}
::-webkit-scrollbar-corner{background:#2a2a2a}

#app{display:flex;flex-direction:column;height:100%}

/* ---------- Menu bar ---------- */
#menubar{display:flex;align-items:stretch;height:28px;background:var(--panel2);border-bottom:1px solid var(--border);flex:none;position:relative;z-index:50}
.logo{width:30px;display:flex;align-items:center;justify-content:center;margin:3px 6px 3px 6px;
  border:2px solid #31a8ff;border-radius:3px;color:#31a8ff;font-weight:700;font-size:12px;letter-spacing:-.5px;background:#001e36}
.mtop{position:relative}
.mtop>span{display:block;padding:0 10px;line-height:28px;cursor:default}
.mtop:hover>span,.mtop.open>span{background:var(--hover)}
.menu{display:none;position:absolute;top:100%;left:0;min-width:240px;background:var(--menu);border:1px solid #111;
  box-shadow:0 6px 18px rgba(0,0,0,.55);padding:4px 0;z-index:100}
.mtop.open>.menu{display:block}
.mitem{position:relative;display:flex;justify-content:space-between;gap:28px;padding:4px 14px 4px 26px;white-space:nowrap;cursor:default}
.mitem .mk{color:var(--dim)}
.mitem:hover{background:var(--accent);color:#fff}
.mitem:hover .mk{color:#dbe9ff}
.mitem.disabled{color:#707070;pointer-events:none}
.mitem.disabled .mk{color:#5c5c5c}
.mitem>.menu{left:100%;top:-5px}
.mitem.has-sub:hover>.menu{display:block}
.msep{height:1px;background:#262626;margin:4px 0;border-bottom:1px solid #4a4a4a}

/* ---------- Options bar ---------- */
#optbar{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;flex:none;background:var(--panel3);
  border-bottom:1px solid var(--border);box-shadow:inset 0 1px 0 #4b4b4b;overflow:hidden;white-space:nowrap}
#optbar .otool{color:#e8e8e8;display:flex;align-items:center}
#optbar .vsep{width:1px;height:22px;background:#242424;border-right:1px solid #4d4d4d}
#optbar .hint{color:var(--dim)}
#optbar label{color:#b9b9b9}
.ogroup{display:flex;align-items:center;gap:6px}
.ogroup input[type=range]{width:90px}
.ogroup input[type=number]{width:52px}
.btn{background:#4a4a4a;border:1px solid #1c1c1c;border-radius:3px;height:24px;padding:0 12px;cursor:pointer}
.btn:hover{background:#585858}
.btn.primary{background:#1473e6;border-color:#0b4fa8;color:#fff}
.btn.primary:hover{background:#2a86f5}
.btn.tog{width:26px;padding:0;font-weight:700}
.btn.tog.on{background:#1473e6;border-color:#0b4fa8;color:#fff}
.btn.sq{width:26px;padding:0;display:flex;align-items:center;justify-content:center}

/* ---------- Main ---------- */
#main{display:flex;flex:1;min-height:0}
#toolbar{width:48px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;box-shadow:inset -1px 0 0 #444}
.tool{width:36px;height:34px;border:1px solid transparent;border-radius:3px;background:transparent;color:#c9c9c9;
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;padding:0}
.tool:hover{background:var(--hover)}
.tool.active{background:#161616;border-color:#000;color:#fff;box-shadow:inset 0 0 0 1px #3f3f3f}
.tool.active::after{content:"";position:absolute;right:2px;bottom:2px;border:3px solid transparent;border-right-color:#999;border-bottom-color:#999}
.tsep{width:30px;height:1px;background:#222;border-bottom:1px solid #484848;margin:5px 0}
#colors{position:relative;width:40px;height:44px;margin-top:6px}
#bgsw,#fgsw{position:absolute;width:22px;height:22px;border:1px solid #000;box-shadow:0 0 0 1px #aaa;cursor:pointer}
#bgsw{right:2px;bottom:4px}
#fgsw{left:3px;top:3px;z-index:2}
#swapc,#defc{position:absolute;cursor:pointer;color:#bbb;background:none;border:0;padding:0}
#swapc{right:1px;top:-2px}
#defc{left:1px;bottom:2px}
#swapc:hover,#defc:hover{color:#fff}
.hidepick{position:absolute;opacity:0;width:0;height:0;pointer-events:none}

#center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--workspace)}
#tabbar{height:28px;flex:none;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding-left:2px}
#doctab{display:flex;align-items:center;gap:10px;height:26px;padding:0 10px;background:var(--workspace);border:1px solid var(--border);border-bottom:0;color:#ddd;white-space:nowrap}
#doctab[hidden]{display:none}
#doctab .x{color:#999;cursor:pointer;font-size:14px;line-height:1}
#doctab .x:hover{color:#fff}
#stage{flex:1;min-height:0;overflow:auto;display:flex;position:relative;background:#282828}
#docpad{margin:auto;padding:70px;flex:none}
#docpad[hidden]{display:none}
#docwrap{position:relative;box-shadow:0 0 0 1px #000,0 6px 30px rgba(0,0,0,.6);touch-action:none;
  background-color:#fff;
  background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);
  background-size:16px 16px;background-position:0 0,8px 8px}
#view{display:block}
#welcome{margin:auto;text-align:center;color:var(--dim);padding:40px}
#welcome h1{font-weight:300;font-size:26px;color:#ddd;margin:0 0 8px}
#welcome p{margin:0 0 22px}
#welcome .btn{height:32px;padding:0 22px;font-size:13px;margin:0 6px}
#welcome[hidden]{display:none}

#crop{position:absolute;pointer-events:none;outline:1px solid #fff;box-shadow:0 0 0 5000px rgba(0,0,0,.6);z-index:4}
#crop[hidden]{display:none}
#crop .grid{position:absolute;inset:0;
  background:
   linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 33.333% 0/1px 100% no-repeat,
   linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 66.666% 0/1px 100% no-repeat,
   linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 0 33.333%/100% 1px no-repeat,
   linear-gradient(rgba(255,255,255,.4),rgba(255,255,255,.4)) 0 66.666%/100% 1px no-repeat}
#crop i{position:absolute;width:9px;height:9px;background:#fff;border:1px solid #000;margin:-5px 0 0 -5px}
#crop .nw{left:0;top:0}#crop .n{left:50%;top:0}#crop .ne{left:100%;top:0}
#crop .w{left:0;top:50%}#crop .e{left:100%;top:50%}
#crop .sw{left:0;top:100%}#crop .s{left:50%;top:100%}#crop .se{left:100%;top:100%}

#texted{position:absolute;z-index:6;min-width:24px;white-space:pre;outline:1px dashed var(--accent);outline-offset:2px;
  line-height:1.2;padding:0;margin:0;cursor:text;background:rgba(255,255,255,.04);caret-color:currentColor}
#bcursor{position:fixed;pointer-events:none;border-radius:50%;border:1px solid #fff;box-shadow:0 0 0 1px #000,inset 0 0 0 1px #000;
  z-index:30;display:none;transform:translate(-50%,-50%)}

/* ---------- Right panels ---------- */
#right{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;box-shadow:inset 1px 0 0 #444}
.panel{display:flex;flex-direction:column;border-bottom:1px solid var(--border);min-height:0;flex:none}
#right{overflow-y:auto}
.ptabs{display:flex;align-items:flex-end;height:26px;background:var(--panel2);border-bottom:1px solid var(--border);flex:none;padding-left:2px}
.ptab{padding:0 12px;height:25px;line-height:25px;color:#999;text-transform:none;cursor:default;border-right:1px solid #222}
.ptab.active{background:var(--panel);color:#e4e4e4;box-shadow:inset 0 2px 0 var(--accent)}
.ptabs .grow{flex:1}
.ptabs .pmenu{color:#888;padding:0 8px;line-height:25px;align-self:center}
.pbody{display:none;overflow:auto;min-height:0}
.pbody.active{display:block}
#p-color{height:168px}
#p-adj{height:340px}
#p-layers{flex:1 0 220px;border-bottom:0}
#p-layers .pbody{display:flex;flex-direction:column;flex:1}

.srow{display:grid;grid-template-columns:78px 1fr 52px;align-items:center;gap:8px;padding:3px 12px}
.srow label{color:#bdbdbd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow input[type=number]{width:52px}
.dlg .srow{padding:5px 0;grid-template-columns:90px 1fr 56px}
.ogroup .srow{display:flex;padding:0;gap:6px}
.ogroup .srow input[type=range]{width:90px}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;background:transparent;margin:0;min-width:0;width:100%;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#151515;border-radius:2px;box-shadow:0 1px 0 #4a4a4a}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#d4d4d4;margin-top:-4.5px;border:1px solid #111}
input[type=range]::-moz-range-track{height:3px;background:#151515;border-radius:2px}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#d4d4d4;border:1px solid #111}
input[type=number],input[type=text],select{background:#1d1d1d;color:var(--text);border:1px solid #101010;border-radius:2px;height:22px;padding:0 5px;font:inherit;outline:none;box-shadow:inset 0 1px 0 #0008}
input[type=number]:focus,input[type=text]:focus,select:focus{border-color:var(--accent)}
select{padding:0 2px}
.sect{padding:8px 12px 2px;color:#e0e0e0;font-weight:600;letter-spacing:.2px}
.sect.first{padding-top:10px}
.btnrow{display:flex;gap:6px;padding:8px 12px;flex-wrap:wrap}
.hexrow{display:flex;align-items:center;gap:8px;padding:2px 12px 6px}
.hexrow .prev{width:34px;height:22px;border:1px solid #000;box-shadow:0 0 0 1px #666}
.hexrow input{width:84px}
#swatches{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;padding:10px 12px}
#swatches i{aspect-ratio:1;border:1px solid #111;cursor:pointer}
#swatches i:hover{outline:1px solid #fff}

#historyList{padding:2px 0}
.hitem{padding:4px 12px;cursor:default;white-space:nowrap;color:#cfcfcf}
.hitem:hover{background:#3d3d3d}
.hitem.cur{background:var(--sel);color:#fff}
.hitem.future{color:#707070}

.lctl{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);flex:none}
.lctl label{color:#bdbdbd}
.lctl .oprow{display:flex;align-items:center;gap:8px}
.lctl .oprow input[type=number]{width:50px}
#layers{flex:1;min-height:0;overflow:auto;background:#2a2a2a;border-bottom:1px solid var(--border)}
.layer{display:flex;align-items:center;gap:8px;height:44px;padding:0 8px 0 4px;border-bottom:1px solid #1f1f1f;background:#353535;cursor:default}
.layer:hover{background:#3b3b3b}
.layer.sel{background:var(--sel);color:#fff}
.layer.dragover{box-shadow:inset 0 2px 0 var(--accent)}
.layer .eye{width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:#ddd;flex:none}
.layer .eye.off svg{opacity:0}
.layer .eye:hover{color:#fff}
.layer .thumb{width:44px;height:32px;border:1px solid #111;flex:none;display:block;
  background-color:#fff;background-image:linear-gradient(45deg,#bbb 25%,transparent 25%,transparent 75%,#bbb 75%),linear-gradient(45deg,#bbb 25%,transparent 25%,transparent 75%,#bbb 75%);
  background-size:8px 8px;background-position:0 0,4px 4px}
.layer .lname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .lname input{width:100%;height:20px}
.layer.hidden-l .thumb,.layer.hidden-l .lname{opacity:.5}
#lfoot{display:flex;justify-content:flex-end;gap:4px;padding:5px 8px;background:var(--panel);flex:none}
#lfoot .btn{width:28px;height:24px;padding:0;display:flex;align-items:center;justify-content:center}

#selcv{position:absolute;left:0;top:0;pointer-events:none;z-index:3}
#clonemark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border:1px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #000;pointer-events:none;z-index:5}
#clonemark::before,#clonemark::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px #000}
#clonemark::before{left:10px;top:3px;width:1px;height:16px}
#clonemark::after{top:10px;left:3px;height:1px;width:16px}
#clonemark[hidden]{display:none}
#curvecv{display:block;margin:6px auto 4px;width:190px;height:190px;background:#1b1b1b;border:1px solid #000;cursor:crosshair;touch-action:none}
.btn.wide{width:100%;height:30px;font-size:13px}
.checks{display:flex;align-items:center;gap:6px}
/* ---------- Status bar ---------- */
#statusbar{height:24px;flex:none;display:flex;align-items:center;gap:18px;padding:0 10px;background:var(--panel2);border-top:1px solid var(--border);color:#a8a8a8}
#statusbar input{width:64px;height:18px;text-align:right}
#statusbar .grow{flex:1}
#statusmsg{color:#e0b060}

/* ---------- Modal ---------- */
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:500;display:flex;align-items:flex-start;justify-content:center;padding-top:12vh}
.dlg{background:#3a3a3a;border:1px solid #101010;box-shadow:0 12px 40px rgba(0,0,0,.7);min-width:360px;max-width:min(560px,94vw);outline:none}
.dlg-title{padding:9px 14px;background:#2b2b2b;border-bottom:1px solid #151515;font-size:13px}
.dlg-body{padding:14px 16px}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 14px}
.dlg .btn{height:26px;min-width:76px}
.frow{display:grid;grid-template-columns:90px 1fr;gap:8px;align-items:center;padding:4px 0}
.frow input[type=text],.frow input[type=number],.frow select{width:100%}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0}
.kbd-grid{display:grid;grid-template-columns:auto 1fr;gap:5px 18px}
.kbd-grid b{color:#fff;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <div id="menubar"><div class="logo">Ed</div></div>
  <div id="optbar"></div>
  <div id="main">
    <div id="toolbar"></div>
    <div id="center">
      <div id="tabbar"><div id="doctab" hidden><span id="doctitle"></span><span class="x" id="doclose" title="Close">×</span></div></div>
      <div id="stage">
        <div id="welcome">
          <h1>Web Image Editor</h1>
          <p>Open an image from your computer, or create a new document.<br>You can also drag &amp; drop an image here, or paste one with Ctrl+V.</p>
          <button class="btn primary" id="w-open">Open Image…</button><button class="btn" id="w-new">New Document…</button>
        </div>
        <div id="docpad" hidden>
          <div id="docwrap">
            <canvas id="view"></canvas>
            <canvas id="selcv" hidden></canvas>
            <div id="clonemark" hidden></div>
            <div id="crop" hidden><div class="grid"></div><i class="nw"></i><i class="n"></i><i class="ne"></i><i class="w"></i><i class="e"></i><i class="sw"></i><i class="s"></i><i class="se"></i></div>
          </div>
        </div>
      </div>
    </div>
    <div id="right">
      <div class="panel" id="p-color">
        <div class="ptabs"><div class="ptab active" data-t="color">Color</div><div class="ptab" data-t="swatches">Swatches</div><div class="grow"></div><div class="pmenu">≡</div></div>
        <div class="pbody active" data-t="color" id="colorBody"></div>
        <div class="pbody" data-t="swatches"><div id="swatches"></div><div style="padding:0 12px;color:var(--dim)">Click: foreground · Shift+click: background</div></div>
      </div>
      <div class="panel" id="p-adj">
        <div class="ptabs"><div class="ptab active" data-t="adj">Adjustments</div><div class="ptab" data-t="curves">Curves</div><div class="ptab" data-t="hist">History</div><div class="grow"></div><div class="pmenu">≡</div></div>
        <div class="pbody active" data-t="adj" id="adjBody"></div>
        <div class="pbody" data-t="curves" id="curvesBody"></div>
        <div class="pbody" data-t="hist"><div id="historyList"></div></div>
      </div>
      <div class="panel" id="p-layers">
        <div class="ptabs"><div class="ptab active">Layers</div><div class="grow"></div><div class="pmenu">≡</div></div>
        <div class="pbody active">
          <div class="lctl">
            <label>Mode</label><select id="lblend"></select>
            <label>Opacity</label><div class="oprow"><input type="range" id="lop" min="0" max="100" value="100"><input type="number" id="lopn" min="0" max="100" value="100"></div>
          </div>
          <div id="layers"></div>
          <div id="lfoot"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="statusbar">
    <span>Zoom <input type="text" id="zoomin" value="100%"></span>
    <span id="docinfo"></span>
    <span id="statusmsg" class="grow"></span>
    <span id="coords"></span>
  </div>
</div>
<div id="bcursor"></div>
<input type="file" id="filein" accept="image/*" style="display:none">
<input type="file" id="placein" accept="image/*" style="display:none">
<input type="color" id="fgpick" class="hidepick">
<input type="color" id="bgpick" class="hidepick">

<script>
'use strict';
/* =====================================================================
   Helpers
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in props) {
    const v = props[k];
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c); });
  return e;
}
const ico = p => `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const hexToRgb = h => { h = h.replace('#', ''); if (h.length === 3) h = [...h].map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgbToHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function cloneCanvas(c) { const n = mkCanvas(c.width, c.height); n.getContext('2d').drawImage(c, 0, 0); return n; }

let statusTimer = 0;
function status(msg) {
  const s = $('#statusmsg'); s.textContent = msg;
  clearTimeout(statusTimer); statusTimer = setTimeout(() => s.textContent = '', 4500);
}

/* =====================================================================
   State
   ===================================================================== */
const S = {
  tool: 'brush', fg: '#000000', bg: '#ffffff',
  brush: { size: 30, hardness: 80, opacity: 100 },
  eraser: { size: 40, hardness: 100, opacity: 100 },
  clone: { size: 40, hardness: 60, opacity: 100 },
  text: { font: 'Arial', size: 48, bold: false, italic: false },
  tol: 32, ratio: 'free', wandTol: 32, contig: true, rmTol: 40
};
const isBrushy = t => t === 'brush' || t === 'eraser' || t === 'clone';
const brushCfg = (t = S.tool) => t === 'eraser' ? S.eraser : t === 'clone' ? S.clone : S.brush;
let doc = null;
let uid = 1, layerCounter = 1;
const MAXH = 50;
const BLENDS = [['Normal', 'source-over'], ['Darken', 'darken'], ['Multiply', 'multiply'], ['Color Burn', 'color-burn'], ['Lighten', 'lighten'],
  ['Screen', 'screen'], ['Color Dodge', 'color-dodge'], ['Overlay', 'overlay'], ['Soft Light', 'soft-light'], ['Hard Light', 'hard-light'],
  ['Difference', 'difference'], ['Exclusion', 'exclusion'], ['Hue', 'hue'], ['Saturation', 'saturation'], ['Color', 'color'], ['Luminosity', 'luminosity']];

const view = $('#view'), vctx = view.getContext('2d');
const stage = $('#stage'), docwrap = $('#docwrap');

const activeLayer = () => doc && doc.layers.find(l => l.id === doc.activeId);
function newLayer(name, w, h) {
  return { id: uid++, name, visible: true, opacity: 1, blend: 'source-over', canvas: mkCanvas(w, h), snap: null, dirty: true };
}
function editable() {
  const l = activeLayer();
  if (!l) return false;
  if (!l.visible) { status('Could not complete the command because the target layer is hidden.'); return false; }
  return true;
}

/* =====================================================================
   History (snapshots share unchanged layer bitmaps)

/* ---------- One-click background removal ----------
   Learns the dominant colours along the image border, floods inward from the border through
   anything similar (plus smooth gradients), then erodes + softens the cut-out edge. */
function removeBackground() {
  if (!doc || !editable()) return;
  commitText(); flushAdjust();
  const l = activeLayer(), w = l.canvas.width, h = l.canvas.height, c = l.canvas.getContext('2d');
  const id = c.getImageData(0, 0, w, h), d = id.data, T = S.rmTol, T2 = T * T, TG = (T * 1.8) * (T * 1.8);
  // 1. dominant border colours
  const buckets = new Map(); let total = 0;
  const addPx = (x, y) => {
    const i = (y * w + x) * 4; if (d[i + 3] < 16) return;
    const key = ((d[i] >> 3) << 10) | ((d[i + 1] >> 3) << 5) | (d[i + 2] >> 3);
    const b = buckets.get(key) || { n: 0, r: 0, g: 0, b: 0 };
    b.n++; b.r += d[i]; b.g += d[i + 1]; b.b += d[i + 2]; buckets.set(key, b); total++;
  };
  for (let x = 0; x < w; x++) { addPx(x, 0); addPx(x, h - 1); }
  for (let y = 1; y < h - 1; y++) { addPx(0, y); addPx(w - 1, y); }
  const cols = [];
  for (const b of [...buckets.values()].sort((a, z) => z.n - a.n)) {
    if (cols.length >= 4 || (cols.length && b.n < total * .08)) break;
    const col = [b.r / b.n, b.g / b.n, b.b / b.n];
    if (cols.every(o => (o[0] - col[0]) ** 2 + (o[1] - col[1]) ** 2 + (o[2] - col[2]) ** 2 > T2 / 4)) cols.push(col);
  }
  const near = i => {
    let best = 1e9;
    for (const o of cols) { const e = (d[i] - o[0]) ** 2 + (d[i + 1] - o[1]) ** 2 + (d[i + 2] - o[2]) ** 2; if (e < best) best = e; }
    return best;
  };
  const match = i => d[i + 3] < 16 || near(i) <= T2;
  // 2. flood inward from the border
  const bg = new Uint8Array(w * h), stack = [];
  const seed = (x, y) => { const k = y * w + x; if (!bg[k] && match(k * 4)) { bg[k] = 1; stack.push(k); } };
  for (let x = 0; x < w; x++) { seed(x, 0); seed(x, h - 1); }
  for (let y = 0; y < h; y++) { seed(0, y); seed(w - 1, y); }
  while (stack.length) {
    const k = stack.pop(), x = k % w, y = (k / w) | 0, i = k * 4;
    for (let n = 0; n < 4; n++) {
      const nx = n === 0 ? x - 1 : n === 1 ? x + 1 : x, ny = n === 2 ? y - 1 : n === 3 ? y + 1 : y;
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const nk = ny * w + nx; if (bg[nk]) continue;
      const j = nk * 4;
      const step = (d[i] - d[j]) ** 2 + (d[i + 1] - d[j + 1]) ** 2 + (d[i + 2] - d[j + 2]) ** 2;
      if (match(j) || (step <= 100 && near(j) <= TG)) { bg[nk] = 1; stack.push(nk); }
    }
  }
  let removed = 0; for (let k = 0; k < bg.length; k++) removed += bg[k];
  const frac = removed / bg.length;
  if (frac < .005) { status('No clear background found. Try a higher sensitivity.'); return; }
  if (frac > .97) { status('Almost everything looks like background. Try a lower sensitivity.'); return; }
  // 3. erode the cut by 1px, then soften it
  let A = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const k = y * w + x;
    if (bg[k]) continue;
    A[k] = (x > 0 && bg[k - 1]) || (x < w - 1 && bg[k + 1]) || (y > 0 && bg[k - w]) || (y < h - 1 && bg[k + w]) ? 0 : 255;
  }
  const B = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0;
    for (let j = -1; j <= 1; j++) for (let i2 = -1; i2 <= 1; i2++) s += A[Math.min(h - 1, Math.max(0, y + j)) * w + Math.min(w - 1, Math.max(0, x + i2))];
    B[y * w + x] = s / 9;
  }
  for (let k = 0; k < B.length; k++) { const i = k * 4 + 3; if (B[k] < d[i]) d[i] = B[k]; }
  c.putImageData(id, 0, 0);
  commit('Remove Background');
  status(`Background removed (${Math.round(frac * 100)}% of the layer). Ctrl+Z to undo, or change Sensitivity and try again.`);
}

    ['Image Rotation', '', [['Rotate 180°', '', rotate180], ['Rotate 90° Clockwise', '', rotateCW], ['Rotate 90° Counter Clockwise', '', rotateCCW], '-', ['Flip Canvas Horizontal', '', flipH], ['Flip Canvas Vertical', '', flipV]]],
    ['Crop to Box', 'C, Enter', () => { selectTool('crop'); }], '-',
    ['Adjustments', '', [
      ['Invert', 'Ctrl+I', () => runFilter('Invert', FILTERS.invert)],
      ['Desaturate', 'Ctrl+Shift+U', () => runFilter('Desaturate', FILTERS.desaturate)],
      ['Sepia', '', () => runFilter('Sepia', FILTERS.sepia)],
      ['Posterize…', '', () => runParamFilter('Posterize…', [{ k: 'levels', label: 'Levels', min: 2, max: 32, val: 5 }], FILTERS.posterize)]]]
  ],
  Layer: [
    ['New Layer', 'Ctrl+Shift+N', addLayer], ['Duplicate Layer', 'Ctrl+J', duplicateLayer], ['Delete Layer', '', deleteLayer], '-',
    ['Bring Forward', 'Ctrl+]', () => moveLayer(1)], ['Send Backward', 'Ctrl+[', () => moveLayer(-1)], '-',
    ['Merge Down', 'Ctrl+E', mergeDown], ['Flatten Image', '', flattenImage], '-',
    ['Remove Background', '', removeBackground]
  ],
  Select: [
    ['All', 'Ctrl+A', selectAll], ['Deselect', 'Ctrl+D', deselect, { enabled: () => doc && doc.sel }], ['Inverse', 'Ctrl+Shift+I', invertSel]
  ],
  Filter: [
    ['Blur', '', [['Gaussian Blur…', '', () => runParamFilter('Gaussian Blur…', [{ k: 'radius', label: 'Radius (px)', min: 0.5, max: 100, step: 0.5, val: 6 }], FILTERS.blur)]]],
    ['Sharpen', '', [['Unsharp Mask…', '', () => runParamFilter('Unsharp Mask…', [{ k: 'amount', label: 'Amount (%)', min: 1, max: 500, val: 120 }, { k: 'radius', label: 'Radius (px)', min: 0.5, max: 20, step: 0.5, val: 2 }], FILTERS.sharpen)]]],
    ['Noise', '', [['Add Noise…', '', () => runParamFilter('Add Noise…', [{ k: 'amount', label: 'Amount (%)', min: 1, max: 100, val: 15 }, { type: 'check', k: 'mono', label: 'Monochromatic', val: true }], FILTERS.noise)]]],
    ['Pixelate', '', [['Mosaic…', '', () => runParamFilter('Mosaic…', [{ k: 'size', label: 'Cell size (px)', min: 2, max: 200, val: 12 }], FILTERS.pixelate)]]],
    ['Stylize', '', [['Emboss', '', () => runFilter('Emboss', FILTERS.emboss)], ['Find Edges', '', () => runFilter('Find Edges', FILTERS.edges)]]], '-',
    ['Vignette…', '', () => runParamFilter('Vignette…', [{ k: 'amount', label: 'Amount (%)', min: 1, max: 100, val: 60 }], FILTERS.vignette)]
  ],
  View: [
    ['Zoom In', 'Ctrl++', () => doc && setZoom(doc.zoom * 1.25)], ['Zoom Out', 'Ctrl+-', () => doc && setZoom(doc.zoom / 1.25)],
    ['Fit on Screen', 'Ctrl+0', () => fitView()], ['100%', 'Ctrl+1', () => setZoom(1)]
  ],
  Help: [
    ['Keyboard Shortcuts…', '', shortcutsDialog, noDoc]
  ]
};
let openTop = null;
function closeMenus() { if (openTop) { openTop.classList.remove('open'); openTop = null; } }
function buildMenu(items) {
  const m = el('div', { class: 'menu' });
  for (const it of items) {
    if (it === '-') { m.append(el('div', { class: 'msep' })); continue; }
    const [label, key, fn, opt = {}] = it, sub = Array.isArray(fn);
    const row = el('div', { class: 'mitem' + (sub ? ' has-sub' : '') }, el('span', {}, label), el('span', { class: 'mk' }, sub ? '▸' : key));
    row._it = it;
    if (sub) row.append(buildMenu(fn));
    else row.addEventListener('click', () => { if (row.classList.contains('disabled')) return; closeMenus(); fn(); });
    m.append(row);
  }
  return m;
}
function buildMenus() {
  const bar = $('#menubar');
  for (const [name, items] of Object.entries(MENUS)) {
    const head = el('span', {}, name), top = el('div', { class: 'mtop' }, head, buildMenu(items));
    head.addEventListener('click', () => { if (openTop === top) closeMenus(); else { closeMenus(); top.classList.add('open'); openTop = top; updateMenuState(); } });
    top.addEventListener('mouseenter', () => { if (openTop && openTop !== top) { closeMenus(); top.classList.add('open'); openTop = top; updateMenuState(); } });
    bar.append(top);
  }
  document.addEventListener('pointerdown', e => { if (openTop && !openTop.contains(e.target)) closeMenus(); });
}
function updateMenuState() {
  $$('.mitem').forEach(row => {
    const it = row._it; if (!it || Array.isArray(it[2])) return;
    const opt = it[3] || {};
    let ok = opt.doc === false ? true : !!doc;
    if (ok && opt.enabled) ok = !!opt.enabled();
    row.classList.toggle('disabled', !ok);
  });
}

/* =====================================================================
   Global refresh
   ===================================================================== */
function refreshAll() {
  render(); refreshLayers(); refreshHistory(); updateTitle(); updateMenuState(); drawSel();
  const has = !!doc;
  $('#lblend').disabled = !has; $('#lop').disabled = !has; $('#lopn').disabled = !has;
}

/* =====================================================================
   Keyboard
   ===================================================================== */
document.addEventListener('keydown', e => {
  if (modalOpen) return;
  const t = e.target, typing = t.tagName === 'INPUT' && t.type !== 'range' && t.type !== 'checkbox' || t.tagName === 'TEXTAREA' || t.isContentEditable;
  if (typing) return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (e.code === 'Space' && !e.repeat && doc) { spaceDown = true; setToolCursor(); updateBrushCursor(); e.preventDefault(); return; }
  if (e.code === 'Space') { e.preventDefault(); return; }
  if (mod) {
    let handled = true;
    if (k === 'z') e.shiftKey ? redo() : undo();
    else if (k === 'y') redo();
    else if (k === 'o') $('#filein').click();
    else if (k === 'n') e.shiftKey ? addLayer() : newDocDialog();
    else if (k === 's') exportPNG();
    else if (k === 'j') duplicateLayer();
    else if (k === 'e') mergeDown();
    else if (k === 'a') selectAll();
    else if (k === 'd') deselect();
    else if (k === 'i' && e.shiftKey) invertSel();
    else if (k === 'i') doc && runFilter('Invert', FILTERS.invert);
    else if (k === 'u' && e.shiftKey) doc && runFilter('Desaturate', FILTERS.desaturate);
    else if (k === '0') fitView();
    else if (k === '1') doc && setZoom(1);
    else if (k === '=' || k === '+') doc && setZoom(doc.zoom * 1.25);
    else if (k === '-') doc && setZoom(doc.zoom / 1.25);
    else if (k === ']') moveLayer(1);
    else if (k === '[') moveLayer(-1);
    else handled = false;
    if (handled) e.preventDefault();
    return;
  }
  if (!doc) return;
  if (S.tool === 'crop' && k === 'enter') { applyCrop(); e.preventDefault(); return; }
  if (S.tool === 'crop' && k === 'escape') { cancelCrop(); return; }
  if (k === 'delete') { clearLayer(); return; }
  const map = { v: 'move', w: 'wand', s: 'clone', c: 'crop', b: 'brush', e: 'eraser', g: 'bucket', t: 'text', i: 'eyedropper', z: 'zoom' };
  if (map[k] && !e.altKey) { selectTool(map[k]); e.preventDefault(); return; }
  if (k === 'x') swapColors();
  else if (k === 'd') defaultColors();
  else if (k === '[' || k === ']') {
    const cfg = brushCfg(), dir = k === ']' ? 1 : -1, s = cfg.size;
    cfg.size = clamp(s + dir * (s < 10 ? 1 : s < 50 ? 5 : 10), 1, 300);
    if (isBrushy(S.tool)) buildOptions();
    updateBrushCursor();
  }
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && spaceDown) { spaceDown = false; setToolCursor(); updateBrushCursor(); }
});
window.addEventListener('blur', () => { spaceDown = false; });

/* =====================================================================
   File input, drag & drop, paste
   ===================================================================== */
$('#filein').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; openFile(f); });
$('#placein').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; placeFile(f); });
$('#w-open').onclick = () => $('#filein').click();
$('#w-new').onclick = newDocDialog;
$('#doclose').onclick = closeDoc;
window.addEventListener('dragover', e => { if (e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop', e => {
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (!f) return;
  e.preventDefault();
  if (f.type.startsWith('image/')) doc ? placeFile(f) : openFile(f);
});
window.addEventListener('paste', e => {
  if (e.target.isContentEditable || e.target.tagName === 'INPUT') return;
  const item = [...(e.clipboardData ? e.clipboardData.items : [])].find(i => i.type.startsWith('image/'));
  if (item) { e.preventDefault(); const f = item.getAsFile(); doc ? placeFile(f) : openFile(f); }
});
window.addEventListener('beforeunload', e => { if (doc && doc.history.length > 1) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => { if (doc) layoutCrop(); });
$('#zoomin').addEventListener('keydown', e => e.stopPropagation());
$('#zoomin').addEventListener('change', e => { const v = parseFloat(e.target.value); if (doc && v > 0) setZoom(v / 100); else if (doc) applyZoom(); });
$('#zoomin').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });

/* =====================================================================
   Init
   ===================================================================== */
buildMenus(); buildToolbar(); buildOptions(); buildColorPanel(); buildAdjustments(); buildCurves(); buildLayerPanel();
setFg(S.fg); setBg(S.bg); setToolCursor(); refreshAll();
</script>
</body>
